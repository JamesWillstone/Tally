<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tally – Monthly Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f1f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1a1e" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f1f4f3;--panel:#fff;--ink:#14262b;--mute:#62747a;--line:#d7dfdd;--inc:#1d7a5c;--out:#c2452d;--acc:#14262b;--onacc:#fff;--track:#e7ecea;--grid:#e1e7e5;--field:#fff;--r:14px;--r2:8px;--fs:15px;--font:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color-scheme:light}
[data-theme=dark]{--bg:#0e1a1e;--panel:#162529;--ink:#e6eeee;--mute:#8fa3a8;--line:#293c42;--inc:#4cc19a;--out:#ef7a62;--track:#25373d;--grid:#25373d;--field:#0f1e22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{margin:0 0 14px;font-size:16px;font-weight:650}
.nav{display:flex;align-items:center;gap:6px}
.nav b{min-width:140px;text-align:center;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:var(--r2);padding:6px 12px}
button:hover{border-color:var(--ink)}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--field);border-radius:var(--r2);padding:7px 10px;width:100%}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.strip div{padding:14px 20px;border-right:1px solid var(--line)}
.strip div:last-child{border:0}
.strip span{display:block;color:var(--mute);font-size:13px}
.strip b{font-size:30px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.inc{color:var(--inc)}.out{color:var(--out)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g2>.panel{margin:0}
.donuts{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.donut svg{display:block;width:100%;max-width:230px;margin:0 auto}
.donut h3{margin:0 0 6px;font-size:14px;font-weight:600;text-align:center;color:var(--mute)}
.lg{list-style:none;margin:12px 0 0;padding:0;font-size:13px}
.lg li{display:flex;align-items:center;gap:8px;padding:2px 0}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums;color:var(--mute)}
.brow{display:grid;grid-template-columns:84px 80px 1fr;gap:10px;align-items:center;padding:6px 0}
.brow input{padding:4px 8px}
.track{height:10px;border-radius:6px;background:var(--track);position:relative}
.fill{height:100%;border-radius:6px}
.brow small{grid-column:3;color:var(--mute);margin-top:-6px;font-variant-numeric:tabular-nums}
.over small{color:var(--out)}
form{display:grid;grid-template-columns:110px 110px 1fr 130px 1.4fr auto;gap:8px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
td i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
td button{border:0;background:none;color:var(--mute);padding:2px 8px}
.empty{color:var(--mute);padding:14px 0}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.tchart svg{width:100%;height:auto;display:block}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:20px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dh h2{margin:0}
.srow{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.5)}
@media(max-width:820px){.srow{grid-template-columns:1fr}.g2,.donuts{grid-template-columns:1fr}form{grid-template-columns:1fr 1fr}form input[name=note],form button{grid-column:1/-1}.strip b{font-size:22px}.strip div{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>Tally</h1>
  <div class="nav"><button id="prev" aria-label="Previous month">&lsaquo;</button><b id="month"></b><button id="next" aria-label="Next month">&rsaquo;</button></div>
  <div class="nav"><button id="install" hidden>Install app</button><button id="gear">Settings</button></div>
 </header>

 <div class="strip" id="sum"></div>

 <section class="panel">
  <div class="donuts">
   <div class="donut" id="d1"></div>
   <div class="donut" id="d2"></div>
  </div>
 </section>

 <div class="g2">
  <section class="panel">
   <h2>Budget vs. spent</h2>
   <div id="bars"></div>
  </section>
  <section class="panel tchart">
   <h2>Last 6 months</h2>
   <div id="trend"></div>
  </section>
 </div>

 <section class="panel">
  <h2>Transactions</h2>
  <form id="f">
   <select name="type" aria-label="Type"><option value="exp">Expense</option><option value="inc">Income</option></select>
   <input name="amt" type="number" min="0.01" step="0.01" placeholder="Amount" required aria-label="Amount">
   <select name="cat" aria-label="Category"></select>
   <input name="date" type="date" required aria-label="Date">
   <input name="note" placeholder="Note (optional)" aria-label="Note">
   <button class="pri">Add</button>
  </form>
  <div id="list"></div>
  <div class="foot"><button id="sample">Load sample data</button><button id="clear">Clear all data</button></div>
 </section>
</div>

<dialog id="dlg" aria-label="Settings"><div class="dh"><h2>Settings</h2><button id="x">Close</button></div><div id="sb"></div></dialog>

<script>
const NAMES=["Housing","Food","Transport","Utilities","Health","Fun","Shopping","Other"];
const PALS={default:["#2f5d8a","#e08a1e","#1f8a7a","#7a6fb5","#c94f6d","#d9b400","#5e9e3c","#8a949b"],colorblind:["#0072b2","#e69f00","#009e73","#cc79a7","#d55e00","#f0e442","#56b4e9","#999999"],muted:["#5b7c99","#c49a6c","#6a9a8f","#8e86a8","#b5707f","#c2b45e","#8aa36f","#9aa3a8"]};
let CATS=[],COL={};const KEY="tally-v1";
const setPal=()=>{CATS=NAMES.map((n,i)=>[n,PALS[ST.pal][i]]);COL=Object.fromEntries(CATS)};
let S={budgets:{},tx:[]};
try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
const DEF={theme:"system",accent:"ink",pal:"default",font:"sans",size:"md",round:"round",cur:"USD"};
const ST=Object.assign({},DEF,S.settings);
const save=()=>{S.settings=ST;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const f0=n=>n.toLocaleString("en-US",{style:"currency",currency:ST.cur,maximumFractionDigits:0});
const f2=n=>n.toLocaleString("en-US",{style:"currency",currency:ST.cur});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const pad=n=>String(n).padStart(2,"0");
const shift=(k,n)=>{const d=new Date(+k.slice(0,4),+k.slice(5)-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const label=k=>new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleString("en-US",{month:"long",year:"numeric"});
const short=k=>new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleString("en-US",{month:"short"});
const now=new Date(), today=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
let ym=today.slice(0,7);

function totals(k){
  const t=S.tx.filter(x=>x.date.startsWith(k)), by={};
  t.filter(x=>x.type==="exp").forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
  return{inc:sum(t.filter(x=>x.type==="inc").map(x=>x.amt)),exp:sum(Object.values(by)),by};
}

function donut(title,data,big,small){
  const R=76,C=2*Math.PI*R,tot=sum(data.map(d=>d[1]));
  let off=0,segs="";
  if(tot>0) data.forEach(([n,v,c])=>{const L=v/tot*C;segs+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${c}" stroke-width="28" stroke-dasharray="${Math.max(L-1.5,0)} ${C-Math.max(L-1.5,0)}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(n)}: ${f0(v)}</title></circle>`;off+=L});
  else segs=`<circle cx="100" cy="100" r="${R}" fill="none" style="stroke:var(--track)" stroke-width="28"/>`;
  const lg=tot>0?data.map(([n,v,c])=>`<li><i style="background:${c}"></i>${n}<em>${f0(v)} · ${Math.round(v/tot*100)}%</em></li>`).join(""):`<li class="empty">Nothing here yet.</li>`;
  return`<h3>${title}</h3><svg viewBox="0 0 200 200" role="img" aria-label="${title}">${segs}<text x="100" y="104" text-anchor="middle" font-size="24" font-weight="650" style="fill:var(--ink)">${f0(big)}</text><text x="100" y="124" text-anchor="middle" font-size="12" style="fill:var(--mute)">${small}</text></svg><ul class="lg">${lg}</ul>`;
}

function trend(){
  const ms=[5,4,3,2,1,0].map(i=>shift(ym,-i)).map(k=>[k,totals(k)]);
  const max=Math.max(100,...ms.flatMap(([,t])=>[t.inc,t.exp])), W=520,H=230,L=44,B=28,T=10,ph=H-B-T;
  const step=Math.pow(10,Math.floor(Math.log10(max))), nice=Math.ceil(max/step)*step;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending by month">`;
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--grid)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" style="fill:var(--mute)">${f0(nice*i/4)}</text>`}
  const gw=(W-L)/6;
  ms.forEach(([k,t],i)=>{
    const x=L+i*gw+gw/2,h1=t.inc/nice*ph,h2=t.exp/nice*ph;
    s+=`<rect x="${x-17}" y="${T+ph-h1}" width="16" height="${h1}" rx="3" style="fill:var(--inc)"><title>${label(k)} income: ${f0(t.inc)}</title></rect>`;
    s+=`<rect x="${x+1}" y="${T+ph-h2}" width="16" height="${h2}" rx="3" style="fill:var(--out)"><title>${label(k)} spent: ${f0(t.exp)}</title></rect>`;
    s+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="12" style="fill:${k===ym?"var(--ink)":"var(--mute)"}" font-weight="${k===ym?700:400}">${short(k)}</text>`;
  });
  return s+`</svg><ul class="lg" style="display:flex;gap:18px;justify-content:center"><li><i style="background:var(--inc)"></i>Income</li><li><i style="background:var(--out)"></i>Spent</li></ul>`;
}

function render(){
  const T=totals(ym), bud=sum(CATS.map(([c])=>+S.budgets[c]||0)), net=T.inc-T.exp;
  $("#month").textContent=label(ym);
  $("#sum").innerHTML=`<div><span>Income</span><b class="inc">${f0(T.inc)}</b></div><div><span>Spent</span><b>${f0(T.exp)}</b></div><div><span>${net>=0?"Left":"Over"}</span><b class="${net>=0?"inc":"out"}">${f0(Math.abs(net))}</b></div>`;
  $("#d1").innerHTML=donut("Where it went",CATS.map(([c,col])=>[c,T.by[c]||0,col]).filter(d=>d[1]>0),T.exp,"spent");
  $("#d2").innerHTML=donut("Planned budget",CATS.map(([c,col])=>[c,+S.budgets[c]||0,col]).filter(d=>d[1]>0),bud,"planned");
  $("#bars").innerHTML=CATS.map(([c,col])=>{
    const b=+S.budgets[c]||0,sp=T.by[c]||0,p=b?Math.min(sp/b*100,100):0,o=b&&sp>b;
    return`<div class="brow ${o?"over":""}"><span>${c}</span><input type="number" min="0" step="10" data-b="${c}" value="${b||""}" placeholder="Budget" aria-label="${c} budget"><div class="track"><div class="fill" style="width:${p}%;background:${o?"var(--out)":col}"></div></div><small>${f0(sp)}${b?" of "+f0(b)+(o?" · over by "+f0(sp-b):""):" spent"}</small></div>`;
  }).join("");
  $("#trend").innerHTML=trend();
  const rows=S.tx.filter(x=>x.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $("#list").innerHTML=rows.length?`<table>${rows.map(x=>`<tr><td>${x.date.slice(5).replace("-","/")}</td><td><i style="background:${x.type==="inc"?"var(--inc)":COL[x.cat]||"#8a949b"}"></i>${x.type==="inc"?"Income":x.cat}${x.note?` <span style="color:var(--mute)">· ${esc(x.note)}</span>`:""}</td><td class="n ${x.type==="inc"?"inc":""}">${x.type==="inc"?"+":"−"}${f2(x.amt)}</td><td><button data-d="${x.id}" aria-label="Delete">✕</button></td></tr>`).join("")}</table>`:`<div class="empty">No transactions in ${label(ym)}. Add one above, or load sample data to see the charts.</div>`;
  const dt=$("#f").date; if(!dt.value||!dt.value.startsWith(ym)) dt.value=today.startsWith(ym)?today:ym+"-01";
}

$("#f").cat.innerHTML=NAMES.map(c=>`<option>${c}</option>`).join("");
$("#f").type.onchange=e=>{$("#f").cat.disabled=e.target.value==="inc"};
$("#f").onsubmit=e=>{
  e.preventDefault();const f=e.target,amt=parseFloat(f.amt.value);if(!(amt>0))return;
  S.tx.push({id:Date.now(),date:f.date.value,type:f.type.value,cat:f.type.value==="inc"?"Income":f.cat.value,amt,note:f.note.value.trim()});
  f.amt.value="";f.note.value="";save();ym=f.date.value.slice(0,7);render();f.amt.focus();
};
$("#prev").onclick=()=>{ym=shift(ym,-1);render()};
$("#next").onclick=()=>{ym=shift(ym,1);render()};
$("#bars").onchange=e=>{const c=e.target.dataset.b;if(c){S.budgets[c]=Math.max(0,+e.target.value||0);save();render()}};
$("#list").onclick=e=>{const id=e.target.dataset.d;if(id){S.tx=S.tx.filter(x=>x.id!=id);save();render()}};
$("#clear").onclick=()=>{if(confirm("Delete all budgets and transactions?")){S={budgets:{},tx:[]};save();render()}};
$("#sample").onclick=()=>{
  if(S.tx.length&&!confirm("Add sample data to your existing entries?"))return;
  Object.assign(S.budgets,{Housing:1400,Food:600,Transport:250,Utilities:220,Health:150,Fun:250,Shopping:300,Other:100});
  let id=Date.now();
  for(let i=0;i<4;i++){
    const k=shift(ym,-i),v=(n,j)=>Math.round(n*(1+((i*7+j*3)%9-4)/25));
    [["inc","Income",3900,1,"Paycheck"],["inc","Income",v(250,1),15,"Side work"],["exp","Housing",1350,2,"Rent"],["exp","Utilities",v(210,2),8,"Power & water"],
     ["exp","Food",v(160,3),5,"Groceries"],["exp","Food",v(150,4),14,"Groceries"],["exp","Food",v(120,5),22,"Dining out"],["exp","Transport",v(190,6),10,"Gas"],
     ["exp","Health",v(90,7),12,"Pharmacy"],["exp","Fun",v(210,8),18,"Weekend trip"],["exp","Shopping",v(260,9),20,"Clothes"],["exp","Other",v(60,10),25,""]
    ].forEach(([type,cat,amt,d,note])=>S.tx.push({id:id++,date:k+"-"+pad(d),type,cat,amt,note}));
  }
  save();render();
};
const mq=matchMedia("(prefers-color-scheme: dark)");
const ACC={ink:null,teal:"#1f7a6d",blue:"#2f5d8a",violet:"#6b5bb5",rose:"#c04a6a",amber:"#b86e00"};
const FONTS={sans:'"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,sans-serif',serif:'"Iowan Old Style","Palatino Linotype",Georgia,serif',mono:'ui-monospace,"SF Mono",Menlo,Consolas,monospace'};
const OPTS=[["theme","Theme",[["system","System"],["light","Light"],["dark","Dark"]]],["accent","Accent",[["ink","Ink"],["teal","Teal"],["blue","Blue"],["violet","Violet"],["rose","Rose"],["amber","Amber"]]],["pal","Chart colors",[["default","Default"],["colorblind","Colorblind-safe"],["muted","Muted"]]],["font","Font",[["sans","Sans"],["serif","Serif"],["mono","Mono"]]],["size","Text size",[["sm","Small"],["md","Medium"],["lg","Large"]]],["round","Corners",[["round","Rounded"],["sharp","Sharp"]]]];
const CURS=["USD","EUR","GBP","CAD","AUD","JPY","MXN","INR"];
function apply(){
  const r=document.documentElement,st=r.style,A=ACC[ST.accent];
  r.dataset.theme=ST.theme==="dark"||(ST.theme==="system"&&mq.matches)?"dark":"light";
  st.setProperty("--acc",A||"var(--ink)");st.setProperty("--onacc",A?"#fff":"var(--bg)");
  st.setProperty("--font",FONTS[ST.font]);st.setProperty("--fs",{sm:"13.5px",md:"15px",lg:"17px"}[ST.size]);
  st.setProperty("--r",ST.round==="sharp"?"3px":"14px");st.setProperty("--r2",ST.round==="sharp"?"2px":"8px");
  setPal();
}
function renderSet(){
  $("#sb").innerHTML=OPTS.map(([k,l,o])=>`<div class="srow"><span>${l}</span><div class="seg">${o.map(([v,t])=>`<button data-k="${k}" data-v="${v}" aria-pressed="${ST[k]===v}">${k==="accent"?`<i class="sw" style="background:${ACC[v]||"#14262b"}"></i>`:""}${t}</button>`).join("")}</div></div>`).join("")
   +`<div class="srow"><span>Currency</span><select id="cur">${CURS.map(c=>`<option ${c===ST.cur?"selected":""}>${c}</option>`).join("")}</select></div><div class="srow"><span></span><div><button id="rst">Reset to defaults</button></div></div>`;
}
$("#sb").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.id==="rst")Object.assign(ST,DEF);else if(b.dataset.k)ST[b.dataset.k]=b.dataset.v;else return;
  save();apply();render();renderSet()};
$("#sb").onchange=e=>{if(e.target.id==="cur"){ST.cur=e.target.value;save();render()}};
$("#gear").onclick=()=>{renderSet();$("#dlg").showModal()};
$("#x").onclick=()=>$("#dlg").close();
$("#dlg").onclick=e=>{if(e.target.id==="dlg")$("#dlg").close()};
mq.onchange=()=>{if(ST.theme==="system"){apply();render()}};
apply();render();
let ip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;$("#install").hidden=false});
$("#install").onclick=async()=>{if(!ip)return;ip.prompt();await ip.userChoice;ip=null;$("#install").hidden=true};
addEventListener("appinstalled",()=>{$("#install").hidden=true});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
